name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Guard, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify public surface
        run: node scripts/verify-public-surface.mjs
      - name: Verify registry paths
        run: node scripts/verify-registry-paths.mjs
      - run: npm run lint
      - run: npm run build

  verify-scripts:
    name: Verify scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run verify:* scripts
        run: |
          for script in $(node -p "Object.keys(require('./package.json').scripts).filter(s => s.startsWith('test:')).join(' ')"); do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done
